id: no-throw-local-alias-function
language: TypeScript
severity: error
message: Throw the initializer directly. This local is used only by the next throw.
note: Keep a local when it adds a type boundary or when another statement uses it.
ignores:
  - "**/archive/**"
  - "**/_archive/**"
  - "**/__tests__/**"
  - "**/__fixtures__/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/*.stories.ts"
  - "**/*.bench.ts"
rule:
  all:
    - pattern:
        context: |
          function __candidate() {
            const $LOCAL = $VALUE
            throw $LOCAL
          }
        selector: statement_block
    - inside:
        any:
          - kind: function_declaration
          - kind: function_expression
          - kind: arrow_function
          - kind: method_definition
        field: body
        stopBy: neighbor
constraints:
  VALUE:
    all:
      - not:
          any:
            - kind: arrow_function
            - kind: function_expression
            - kind: class
      - not:
          has:
            any:
              - kind: arrow_function
              - kind: function_expression
              - kind: class
            stopBy: end
