id: no-file-local-generic-record-guard
language: TypeScript
severity: warning
message: Do not add another file-local generic isRecord guard.
note: Decode external input with Effect Schema or Zod. Generic infrastructure code must reuse one package-owned guard. Name that guard's file in this rule's ignores list, so the sanctioned copy is a declared decision.
ignores:
  - "**/archive/**"
  - "**/_archive/**"
  - "**/__tests__/**"
  - "**/__fixtures__/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/*.stories.ts"
  - "**/*.bench.ts"
rule:
  any:
    - all:
        - kind: function_declaration
        - has:
            field: name
            regex: ^isRecord$
    - all:
        - kind: variable_declarator
        - has:
            field: name
            regex: ^isRecord$
        - has:
            field: value
            any:
              - kind: arrow_function
              - kind: function_expression
