rule: rule:trim-after-string-constraint
breaks:
  - why: A name of only spaces passes `.min(1)` and then `.trim()` turns it into an empty string, so the non-empty check never really applies.
    code: |
      import { z } from "zod";

      const signupSchema = z.strictObject({
        displayName: z.string().min(1).trim(),
        email: z.email(),
      });
    fixed: |
      import { z } from "zod";

      const signupSchema = z.strictObject({
        displayName: z.string().trim().min(1),
        email: z.email(),
      });
passes:
  - code: |
      import { z } from "zod";

      const commentSchema = z.strictObject({
        body: z.string().max(2000).trim(),
      });
