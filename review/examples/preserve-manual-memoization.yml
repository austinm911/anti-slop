rule: rule:preserve-manual-memoization
verify: false
reason: Oxlint 1.86 does not report its own documented example for this rule with default options.
breaks:
  - why: The array is mutated after it is created, so the compiler cannot prove the memoized callback still returns the same value and skips optimizing it.
    code: |
      import { useCallback } from "react";

      function useFilterOptions(filters: Filter[]) {
        const options = [];
        options.push(...filters);
        return useCallback(() => options, [options]);
      }
    fixed: |
      import { useCallback } from "react";

      function useFilterOptions(filters: Filter[]) {
        const options = [...filters];
        return useCallback(() => options, [options]);
      }
passes:
  - code: |
      import { useCallback } from "react";

      function SaveButton({ draftId, onSaved }: { draftId: string; onSaved: () => void }) {
        const save = useCallback(async () => {
          await drafts.publish(draftId);
          onSaved();
        }, [draftId, onSaved]);

        return <button onClick={save}>Publish</button>;
      }
