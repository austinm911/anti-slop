rule: rule:no-unsafe-function-type
breaks:
  - why: The `Function` type accepts any callable with any arguments and returns an untyped result, so calls through it are not checked.
    code: |
      export class EventBus {
        private handlers = new Map<string, Function[]>();

        on(event: string, handler: Function) {
          this.handlers.set(event, [...(this.handlers.get(event) ?? []), handler]);
        }
      }
    fixed: |
      type Handler = (payload: unknown) => void;

      export class EventBus {
        private handlers = new Map<string, Handler[]>();

        on(event: string, handler: Handler) {
          this.handlers.set(event, [...(this.handlers.get(event) ?? []), handler]);
        }
      }
passes:
  - code: |
      export function debounce<Args extends unknown[]>(run: (...args: Args) => void, ms: number) {
        let timer: ReturnType<typeof setTimeout> | undefined;
        return (...args: Args) => {
          clearTimeout(timer);
          timer = setTimeout(() => run(...args), ms);
        };
      }
