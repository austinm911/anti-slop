rule: rule:no-direct-mutation-state
breaks:
  - why: Assigning to `this.state` outside the constructor skips `setState`, so React never re-renders with the new value.
    code: |
      import { Component } from "react";

      export class Counter extends Component<{}, { count: number }> {
        state = { count: 0 };
        increment = () => {
          this.state.count = this.state.count + 1;
        };
        render() { return <button type="button" onClick={this.increment}>{this.state.count}</button>; }
      }
    fixed: |
      import { Component } from "react";

      export class Counter extends Component<{}, { count: number }> {
        state = { count: 0 };
        increment = () => {
          this.setState((state) => ({ count: state.count + 1 }));
        };
        render() { return <button type="button" onClick={this.increment}>{this.state.count}</button>; }
      }
passes:
  - code: |
      import { Component } from "react";

      export class Timer extends Component<{ start: number }, { seconds: number }> {
        constructor(props: { start: number }) {
          super(props);
          this.state = { seconds: props.start };
        }
        render() { return <span>{this.state.seconds}s</span>; }
      }
