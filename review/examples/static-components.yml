rule: rule:static-components
breaks:
  - why: Creating `Row` during render gives it a new identity every render, so React remounts it and throws away its state.
    code: |
      function InvoiceRow({ invoice, columns }: { invoice: Invoice; columns: Column[] }) {
        const Row = createRow(columns);
        return <table><tbody><Row invoice={invoice} /></tbody></table>;
      }
    fixed: |
      const Row = createRow(invoiceColumns);

      function InvoiceRow({ invoice }: { invoice: Invoice }) {
        return <table><tbody><Row invoice={invoice} /></tbody></table>;
      }
passes:
  - code: |
      function StatusIcon({ status }: { status: "ok" | "error" }) {
        const Icon = status === "ok" ? CheckIcon : AlertIcon;

        return <Icon aria-label={status} />;
      }
