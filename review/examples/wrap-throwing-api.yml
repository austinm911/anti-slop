rule: rule:wrap-throwing-api
breaks:
  - why: JSON.parse throws on malformed input, and calling it outside Result.try lets that exception escape the Result flow.
    code: |
      function readWebhook(body: string) {
        const event: WebhookEvent = JSON.parse(body);
        return event;
      }
    fixed: |
      import { Result } from "better-result";

      function readWebhook(body: string) {
        return Result.try({
          try: (): WebhookEvent => JSON.parse(body),
          catch: (cause) => new MalformedWebhook({ cause }),
        });
      }
  - why: Both fetch and response.json can reject, so they must run inside Result.tryPromise with a tagged error.
    code: |
      async function loadRates(currency: string) {
        const response = await fetch(`https://rates.example.com/${currency}`);
        return response.json();
      }
    fixed: |
      import { Result } from "better-result";

      const loadRates = (currency: string) =>
        Result.tryPromise({
          try: async () => (await fetch(`https://rates.example.com/${currency}`)).json(),
          catch: (cause) => new RatesUnavailable({ cause, currency }),
        });
passes:
  - code: |
      export function GET() {
        const status = { service: "billing", healthy: true };
        return Response.json(status);
      }
