rule: rule:immutability
breaks:
  - why: Assigning to a field of the object `useState` returned edits state in place, so React never sees the change and the screen stays stale.
    code: |
      import { useState } from "react";

      function ThemeSettings() {
        const [settings] = useState({ theme: "light" });
        settings.theme = "dark";
        return <ThemePreview theme={settings.theme} />;
      }
    fixed: |
      import { useState } from "react";

      function ThemeSettings() {
        const [settings, setSettings] = useState({ theme: "light" });
        const enableDark = () => setSettings({ ...settings, theme: "dark" });
        return <ThemePreview theme={settings.theme} onDark={enableDark} />;
      }
passes:
  - code: |
      function CartSummary({ items }: { items: CartItem[] }) {
        const lines: string[] = [];
        for (const item of items) {
          lines.push(`${item.quantity} x ${item.name}`);
        }
        return <pre>{lines.join("\n")}</pre>;
      }
