rule: rule:immutability
breaks:
  - why: The handler pushes into the existing state array and passes the same reference back, so React sees no change and the rule reports the mutation.
    code: |
      function TagEditor() {
        const [tags, setTags] = useState<string[]>([]);
        const addTag = (tag: string) => {
          tags.push(tag);
          setTags(tags);
        };
        return <TagInput onAdd={addTag} tags={tags} />;
      }
    fixed: |
      function TagEditor() {
        const [tags, setTags] = useState<string[]>([]);
        const addTag = (tag: string) => {
          setTags([...tags, tag]);
        };
        return <TagInput onAdd={addTag} tags={tags} />;
      }
  - why: Sorting the `users` prop in place mutates data the parent owns during render.
    code: |
      function UserList({ users }: { users: User[] }) {
        users.sort((a, b) => a.name.localeCompare(b.name));
        return <ul>{users.map((user) => <li key={user.id}>{user.name}</li>)}</ul>;
      }
    fixed: |
      function UserList({ users }: { users: User[] }) {
        const sorted = users.toSorted((a, b) => a.name.localeCompare(b.name));
        return <ul>{sorted.map((user) => <li key={user.id}>{user.name}</li>)}</ul>;
      }
passes:
  - code: |
      function CartSummary({ items }: { items: CartItem[] }) {
        const lines: string[] = [];
        for (const item of items) {
          lines.push(`${item.quantity} x ${item.name}`);
        }
        return <pre>{lines.join("\n")}</pre>;
      }
