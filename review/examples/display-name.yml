rule: rule:display-name
breaks:
  - why: An anonymous arrow passed to `React.memo` has no component name, so React DevTools and error stacks show it as Anonymous.
    code: |
      import React from "react";

      export const UserName = React.memo(({ name }: { name: string }) => <span>{name}</span>);
    fixed: |
      import React from "react";

      export const UserName = React.memo(function UserName({ name }: { name: string }) {
        return <span>{name}</span>;
      });
passes:
  - code: |
      import { forwardRef } from "react";

      export const SearchInput = forwardRef<HTMLInputElement>(function SearchInput(props, ref) {
        return <input ref={ref} type="search" {...props} />;
      });
