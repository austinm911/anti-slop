rule: rule:set-state-in-render
breaks:
  - why: Calling the setter unconditionally in the component body schedules another render every time it renders, which loops forever.
    code: |
      function Pagination({ totalItems }: { totalItems: number }) {
        const [pageCount, setPageCount] = useState(0);
        setPageCount(Math.ceil(totalItems / 20));
        return <PageLinks count={pageCount} />;
      }
    fixed: |
      function Pagination({ totalItems }: { totalItems: number }) {
        const pageCount = Math.ceil(totalItems / 20);
        return <PageLinks count={pageCount} />;
      }
passes:
  - code: |
      function Counter() {
        const [count, setCount] = useState(0);

        return <button onClick={() => setCount(count + 1)}>Clicked {count} times</button>;
      }
