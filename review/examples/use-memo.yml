rule: rule:use-memo
breaks:
  - why: An async `useMemo` callback memoizes a promise rather than the report, so the component renders a pending promise.
    code: |
      import { useMemo } from "react";

      function ReportPage({ reportId }: { reportId: string }) {
        const report = useMemo(async () => {
          return await loadReport(reportId);
        }, [reportId]);
        return <ReportView report={report} />;
      }
    fixed: |
      import { use, useMemo } from "react";

      function ReportPage({ reportId }: { reportId: string }) {
        const reportPromise = useMemo(() => loadReport(reportId), [reportId]);
        return <ReportView report={use(reportPromise)} />;
      }
passes:
  - code: |
      import { useMemo } from "react";

      function RevenueChart({ orders }: { orders: Order[] }) {
        const series = useMemo(() => groupRevenueByMonth(orders), [orders]);

        return <LineChart data={series} />;
      }
