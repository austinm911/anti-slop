rule: rule:use-memo
breaks:
  - why: This `useMemo` callback returns nothing and only runs a side effect, so it is not memoizing a value and belongs in an effect.
    code: |
      function ReportPage({ reportId }: { reportId: string }) {
        useMemo(() => {
          analytics.track("report_viewed", { reportId });
        }, [reportId]);
        return <ReportView reportId={reportId} />;
      }
    fixed: |
      function ReportPage({ reportId }: { reportId: string }) {
        useEffect(() => {
          analytics.track("report_viewed", { reportId });
        }, [reportId]);
        return <ReportView reportId={reportId} />;
      }
passes:
  - code: |
      function RevenueChart({ orders }: { orders: Order[] }) {
        const series = useMemo(() => groupRevenueByMonth(orders), [orders]);

        return <LineChart data={series} />;
      }
