rule: rule:prefer-dom-node-append
breaks:
  - why: "`appendChild()` only takes one node, while `append()` accepts several nodes and strings and is the modern DOM API."
    code: |
      export function renderToast(container: HTMLElement, message: string) {
        const toast = document.createElement("div");
        toast.textContent = message;
        container.appendChild(toast);
      }
    fixed: |
      export function renderToast(container: HTMLElement, message: string) {
        const toast = document.createElement("div");
        toast.textContent = message;
        container.append(toast);
      }
passes:
  - code: |
      export function renderBadge(container: HTMLElement, count: number) {
        const badge = document.createElement("span");
        container.append(badge, ` ${count} new`);
      }
