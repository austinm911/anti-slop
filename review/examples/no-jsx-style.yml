rule: rule:no-jsx-style
breaks:
  - why: The inline style object sets colors and spacing outside the Tailwind theme, so the card drifts from the design system.
    code: |
      export default function PlanCard({ name }: { name: string }) {
        return (
          <div style={{ padding: 16, backgroundColor: "#f5f5f5" }}>
            {name}
          </div>
        );
      }
    fixed: |
      export default function PlanCard({ name }: { name: string }) {
        return <div className="bg-neutral-100 p-4">{name}</div>;
      }
passes:
  - code: |
      import { cn } from "@/lib/cn";

      export default function StatusDot({ online }: { online: boolean }) {
        return (
          <span className={cn("size-2 rounded-full", online ? "bg-green-500" : "bg-neutral-400")} />
        );
      }
